name: ugs-release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  bootstrap-package:
    name: build and publish bootstrap package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Restore annotated release tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify release tag
        run: scripts/validate_release_tag.sh "${GITHUB_REF_NAME}"

      - name: Test bootstrap package
        run: scripts/test_bootstrap_package.sh

      - name: Build bootstrap package
        env:
          SOURCE_DATE_EPOCH: 0
        run: scripts/build_bootstrap_package.sh "${GITHUB_REF_NAME}" --output-dir dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          adapters/github/publish_release.sh "${GITHUB_REF_NAME}" dist

      - name: Consume published bootstrap asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/test_bootstrap_release.sh "${GITHUB_REF_NAME}"
